# pre-commit is a tool to perform a predefined set of tasks manually and/or
# automatically before git commits are made.
#
# Config reference: https://pre-commit.com/#pre-commit-configyaml---top-level
#
# Common tasks
#
# - Run on all files:   pre-commit run --all-files
# - Register git hooks: pre-commit install --hook-type pre-commit
#
# The Rust hooks mirror the checks in `.github/workflows/build_and_lint.yml`.
# `.github/workflows/pre-commit.yml` runs all hooks in CI.

# Generated, vendored, and captured files:
# - binary codec fixtures and definitions copied from xrpl.js / rippled
# - generated mpt-crypto-sys bindings and vendored C headers
exclude: |
  (?x)^(
    src/core/binarycodec/test_data/.*|
    src/core/binarycodec/definitions/definitions\.json|
    internal/mpt-crypto-sys/src/bindings\.rs|
    internal/mpt-crypto-sys/vendor/.*
  )$

repos:
  # Baseline file-hygiene hooks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Rust hooks use the contributor's own toolchain (`language: system`), as
  # CI does with `dtolnay/rust-toolchain@stable`.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Run cargo fmt on all crates and fail if reformatting is needed.
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        description: Run cargo clippy with -D warnings against all features.
        entry: cargo clippy --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # Lock files generated behind a private mirror point at that mirror, which
  # CI and other contributors cannot reach. Rewrite them to the public
  # registries.
  - repo: local
    hooks:
      - id: fix-npm-registry-urls
        name: Replace non-public registry URLs in package-lock.json
        entry: >-
          perl -pi -e 's#"resolved": "https?://(?!registry\.npmjs\.org/)[^"]*?/((?:\@[^/"]+/)?[^/"\@]+/-/[^/"]+\.tgz)"#"resolved": "https://registry.npmjs.org/$1"#'
        language: system
        files: (^|/)package-lock\.json$
      - id: fix-pypi-index-urls
        name: Remove non-public index URLs from pip requirements
        entry: >-
          perl -ni -e 'print unless /^--(index-url|extra-index-url|trusted-host)\s+(?!https:\/\/pypi\.org\/)/'
        language: system
        files: ^\.github/requirements/.*\.txt$
