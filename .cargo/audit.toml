# cargo-audit configuration (auto-loaded by `cargo audit`).
#
# [advisories].ignore lists RustSec advisory IDs that are known and
# intentionally accepted, each with a justification. Revisit periodically.

[advisories]
ignore = [
    # RUSTSEC-2026-0235 — rkyv 0.7.x out-of-bounds read in archives with Rc/Arc.
    # Not reachable here: rkyv is only an *optional* dependency of rust_decimal,
    # which we build with `default-features = false, features = ["serde"]` — the
    # `rkyv` feature is never enabled, so rkyv is not compiled or executed. It
    # appears in Cargo.lock (which cargo-audit scans) purely as a resolved
    # optional dep. rust_decimal 1.x pins rkyv `^0.7`, so there is no upgrade
    # path today. Remove this once rust_decimal moves to rkyv >= 0.8.17.
    "RUSTSEC-2026-0235",
    # RUSTSEC-2026-0387 — crypto-bigint < 0.7.6 timing side channels in
    # operations intended to be constant-time. No longer a direct dependency
    # (secp256k1 key validation now uses libsecp256k1). It remains in Cargo.lock
    # only via reqwless -> embedded-tls -> p256 0.13 -> elliptic-curve 0.13 ->
    # crypto-bigint 0.5, i.e. TLS for the no_std JSON-RPC client
    # (`connect_with_tls`). Every link is capped at its 0.x line and the fix only
    # exists in crypto-bigint 0.7.6+, so there is no upgrade path today. Remove
    # this once a reqwless release we can use depends on an embedded-tls built
    # on p256 >= 0.14, or a patched crypto-bigint 0.5.x is published.
    "RUSTSEC-2026-0387",
]
