# Publish the Confidential MPT crates to crates.io, in dependency order.
#
# The crates form a chain:  mpt-crypto-sys  ->  mpt-crypto  ->  xrpl-rust
# (xrpl-rust's `confidential-mpt` feature -> mpt-crypto -> mpt-crypto-sys).
# crates.io requires every dependency to be published before its dependents, so
# they MUST go bottom-up in this order. `cargo publish` (>=1.66) blocks until the
# just-published version appears in the index, so sequential steps resolve.
#
# Manual on purpose: publishing is irreversible (crates.io only supports `yank`,
# not delete), so a human triggers this after the release commit + version bumps
# are merged. `xrpl-rust` is gated behind an input because it is maintainer-owned
# and typically released via its own cadence.
#
# Requirements:
#   * Secret CARGO_REGISTRY_TOKEN — a crates.io token whose account OWNS every
#     crate it publishes. Today mpt-crypto / mpt-crypto-sys are owned by
#     @pdp2121 and xrpl-rust by the maintainer team, so the token's account must
#     be an owner of each crate it pushes (`cargo owner --add ...`).
#   * The crate versions in the respective Cargo.toml files must be bumped to
#     versions not already on crates.io (a version can only be published once).

name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      publish_xrpl_rust:
        description: "Also publish the top-level xrpl-rust crate (maintainer-owned)"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish (mpt-crypto-sys → mpt-crypto → xrpl-rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Bottom of the chain. Its build.rs fetches the native bundle from the
      # mpt-crypto GitHub release at consumer build time; the crate itself ships
      # only source + headers (vendor/lib is excluded), so nothing extra here.
      - name: Publish mpt-crypto-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mpt-crypto-sys --locked

      - name: Publish mpt-crypto
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p mpt-crypto --locked

      # Only when explicitly requested — enables `cargo add xrpl-rust -F
      # confidential-mpt` from the registry once the two crates above are live.
      - name: Publish xrpl-rust
        if: ${{ inputs.publish_xrpl_rust }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p xrpl-rust --locked
