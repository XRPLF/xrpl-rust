on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

name: Unit Test

jobs:
  unit_test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Test with default features
        run: cargo test --release
        env:
          RUST_BACKTRACE: 1

      # NOTE: confidential-mpt (which statically links the mpt-crypto native
      # archive via FFI) is NOT tested here — it runs in the cross-platform
      # `confidential_mpt` job below, because its build.rs link path differs per
      # OS (macOS ld / GNU ld / MSVC) and must be exercised on each.

      - name: Test for no_std
        run: cargo test --release --no-default-features --features
          embassy-rt,core,utils,wallet,models,helpers,websocket,json-rpc
        env:
          RUST_BACKTRACE: 1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Unit-test coverage is scoped via Cargo features rather than path
      # exclusion. The minimal feature set (`std,core,utils,wallet,models`)
      # compiles only the pure-logic modules — pure crypto, codec, address
      # codec, transaction models, and the `signing` module. Integration-
      # territory code (CLI, async network clients, sync wrappers around
      # network calls, faucet client) is gated behind `helpers`/`json-rpc`/
      # `websocket`/`cli` features, so it simply isn't compiled here and
      # doesn't appear in the coverage report. Those files are exercised by
      # the integration-test workflow against a live rippled.
      - name: Generate coverage report
        run: |
          cargo llvm-cov \
            --no-default-features --features std,core,utils,wallet,models \
            --lcov --output-path lcov.info

      - name: Check coverage thresholds
        run: |
          cargo llvm-cov --summary-only \
            --no-default-features --features std,core,utils,wallet,models \
            --fail-under-lines 83 \
            --fail-under-regions 85 \
            --fail-under-functions 73

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: unit
          fail_ci_if_error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: lcov.info

  # confidential-mpt statically links the self-contained mpt-crypto archive
  # (secp256k1 + OpenSSL) via mpt-crypto-sys/build.rs, whose resolve + link path
  # differs per platform (libmpt-crypto.a with `-lc++` on macOS, `-lstdc++
  # -lpthread -ldl -lm` on Linux; mpt-crypto-static.lib with the Win32 system
  # libs under MSVC). The ubuntu-only unit_test job can't catch a macOS/Windows
  # link regression, so build + test the cMPT models and mpt-crypto wrapper on
  # every target — mirroring xrpl-py's build_wheels_confidential matrix.
  confidential_mpt:
    name: Confidential MPT (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-x86_64 }
          - { os: ubuntu-24.04-arm, label: linux-aarch64 }
          - { os: macos-14, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-2022, label: windows-amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.label }}-cargo-cmpt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-cmpt-

      # Exercises the static link (build.rs downloads + verifies the pinned
      # mpt-crypto natives bundle and links the platform's archive) plus the
      # cMPT transaction-model unit tests and the mpt-crypto safe-wrapper tests.
      - name: Build + test confidential-mpt (static link + models + wrapper)
        run: |
          cargo test --release --features confidential-mpt --lib
          cargo test --release -p mpt-crypto
        env:
          RUST_BACKTRACE: 1
