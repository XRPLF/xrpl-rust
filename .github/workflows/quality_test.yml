on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 0 * * *"

name: Quality Check

jobs:
  quality_check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable, pinned per #288
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # RUSTSEC-2026-0235: rkyv 0.7 is an optional dep of rust_decimal that
        # we do not enable (features = ["serde"] only); ignored until
        # rust_decimal ships rkyv 0.8+ support.
        run: cargo audit --ignore RUSTSEC-2026-0235
